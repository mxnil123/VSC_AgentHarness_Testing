[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vscode-llm-provider-harness"
version = "0.1.0"
description = "Pytest conformance harness for custom VS Code language model backends"
readme = "README.md"
requires-python = ">=3.10"

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["vscode_llm_harness*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
